<head>
    <meta property="og:title" content="Corgi Taco's Statistics">
    <meta property="og:description" content="View Corgi Taco's project statistics.">
    <meta property="og:url" content="https://corgitaco.dev/statistics">
    <meta property="og:type" content="website">

    <meta property="og:image:width"   content="1920">
    <meta property="og:image:height"  content="1080">
    <meta property="og:image:type"    content="image/png">
    <meta property="twitter:card"     content="summary_large_image">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="icon" href="../assets/favicons/statistics.svg" type="image/svg+xml">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/stats_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body id="vanta-bg" class="stats-page">

<div id="main">
    <script src="../assets/js/pagechange.js"></script>

    <div id="sticky-header">
        <div id="titlebar">
            <div id="win-controls">
                <span class="win-btn win-close" title="Close"></span>
                <span class="win-btn win-minimize" title="Minimize"></span>
                <span class="win-btn win-maximize" title="Maximize"></span>
            </div>
            <span id="win-title"></span>
            <script src="../assets/js/win_title.js"></script>
        </div>
        <div class="header">
            <nav role="navigation">
                <ul id="nav-main">
                    <li class="more hidden" data-width="80">
                        <a href="#">☰</a>
                        <ul></ul>
                    </li>
                </ul>
            </nav>
        </div>

        <div id="page-title-bar">
            <h1><i class="fa fa-bar-chart"></i> Statistics</h1>
        </div>
    </div>

    <div id="stats-container"></div>

    <script src="../assets/js/stats_filler.js"></script>
</div>


<pre id="dbgout" style="position:fixed;left:0;top:0;z-index:99999;background:#000;color:#0f0;font-size:11px">pending</pre>
<script>
const errs=[]; window.addEventListener('error',e=>errs.push('ERR '+e.message));
function find(t){return [...document.querySelectorAll('.stat-section')].find(s=>(s.querySelector('.stat-section-title')||{}).textContent.includes(t));}
function report(tag,out){
  const s=find('Downloads Per Mod'), ch=Chart.getChart(s.querySelector('canvas'));
  ch.update('none');                       // settle: headless stalls rAF-driven animation
  const ca=ch.chartArea, ys=ch.scales.y;
  let crowd=0, dropped=0;
  ch.data.datasets.forEach((ds,di)=>{
    const p=(ch.getDatasetMeta(di).data||[]).slice(-1)[0];
    if(!p||!isFinite(p.y)){dropped++;return;}
    if(Math.abs(ca.bottom-p.y)<=2) crowd++;
  });
  out.push('== '+tag+'  yType='+ys.type);
  out.push('   pinned to axis: '+crowd+'/'+ch.data.datasets.length+'   non-finite: '+dropped);
  ch.data.datasets.forEach((ds,di)=>{
    if(!/Celestials 2: Core|^CorgiLib$/.test(ds.label)) return;
    const p=(ch.getDatasetMeta(di).data||[]).slice(-1)[0];
    const v=ds.data.filter(x=>x!=null).slice(-1)[0];
    out.push('   '+ds.label.padEnd(30)+' val='+v+'  y='+Math.round(p.y)+'  ('+Math.round(ca.bottom-p.y)+'px above axis)');
  });
}
setTimeout(()=>{
  document.querySelectorAll('.stat-acc-toggle').forEach(t=>t.click());
  setTimeout(()=>{ if(!find('Downloads Per Mod'))
    document.querySelectorAll('.stat-acc-body').forEach(b=>b.dispatchEvent(new TransitionEvent('transitionend',{propertyName:'grid-template-rows'})));
  },1200);
},2000);
setTimeout(()=>{
  const out=[]; const s=find('Downloads Per Mod');
  const B=t=>[...s.querySelectorAll('.stat-section-head .stat-ctrl-btn')].find(b=>b.textContent===t);
  report('Linear (default)',out);
  B('Log').click();        setTimeout(()=>{
  report('Log',out);
  B('CurseForge').click(); setTimeout(()=>{
  report('Log + CurseForge (has 0-value series)',out);
  B('Linear').click();     setTimeout(()=>{
  report('back to Linear',out);
    out.push(errs.length?errs.join('\n'):'no js errors');
    document.getElementById('dbgout').textContent=out.join('\n');
  },500); },500); },500);
},8000);
</script>

</body>
</html>
